<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>minimap</title>
<style>
  html,body{margin:0;height:100%;background:#05060e;overflow:hidden;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#c8cee6}
  #c{display:block;position:fixed;inset:0}
  #panel{position:fixed;top:0;left:0;bottom:0;width:300px;background:#0c0e18f2;border-right:1px solid #232a44;
         overflow-y:auto;padding:10px 12px 40px;box-shadow:8px 0 24px #0008;z-index:3}
  h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7f89b0;margin:16px 0 6px;
     border-bottom:1px solid #232a44;padding-bottom:4px}
  h2:first-child{margin-top:0}
  .row{display:grid;grid-template-columns:62px 1fr 46px;gap:6px;align-items:center;margin:2px 0}
  .row label{color:#8b93b8}
  .row input[type=range]{width:100%;accent-color:#ffd23f}
  .row .v{text-align:right;color:#e8ecf8;font-variant-numeric:tabular-nums}
  .btns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
  button{background:#1a2138;border:1px solid #2e3860;color:#c8cee6;padding:5px 9px;border-radius:4px;
         cursor:pointer;font:inherit;display:flex;align-items:center;gap:6px}
  button:hover{background:#232c4a}
  button.on{background:#ffd23f;border-color:#ffd23f;color:#181203}
  .sw{width:10px;height:10px;border-radius:2px;display:inline-block;border:1px solid #0006}
  #zoom{position:fixed;right:18px;top:18px;z-index:2;border:1px solid #232a44;border-radius:6px;
        background:#05060e;box-shadow:0 8px 30px #000a;image-rendering:pixelated}
  #cap{position:fixed;right:18px;z-index:2;color:#7f89b0}
  #note{margin:0 0 8px;padding:6px 8px;border-radius:4px;background:#101528;border:1px solid #232a44;color:#8b93b8}
  #field{margin-top:6px;color:#59618a;line-height:1.7}
  #field b{font-weight:400;color:#c8cee6}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="zoom"></canvas>
<div id="cap"></div>
<div id="panel"></div>

<script type="module">
// Drives the GAME. The minimap on the right is the game's OWN minimap, copied
// pixel for pixel out of the frame it just drew and blown up - not a second one
// drawn here, which could show a blip the game does not.
const M = await import('/src/main.js');
const { C } = M;
const cv = document.getElementById('c');
const zoom = document.getElementById('zoom');
const zg = zoom.getContext('2d');
const panel = document.getElementById('panel');
const $ = (id) => document.getElementById(id);

const NAMES = ['Drifter', 'Darter', 'Hulk', 'Splitter', 'Warden'];

// The game listens on window; sealing the panel stops a slider drag also dragging
// the aim underneath it.
['pointerdown', 'pointermove', 'pointerup', 'pointercancel', 'keydown', 'keyup']
  .forEach((t) => panel.addEventListener(t, (e) => e.stopPropagation()));

let mag = 5, dist = 9, spin = 0, pinned = 1;
const field = [];                                 // {k, a} - type and bearing

const place = () => {
  // Re-placed every frame while pinned, so nothing walks in and the picture holds
  // still long enough to be looked at. Unpinned, they are placed once and then
  // the game owns them, which is how you see a blip actually move.
  M.place(field.map((f) => {
    const a = f.a + spin;
    return [Math.sin(a) * dist, C._GY, Math.cos(a) * dist, 9, 9, 0, 0, f.k, 0];
  }));
};

// --- the panel ----------------------------------------------------------------
const row = (lab, min, max, step, get, set) => {
  const d = document.createElement('div');
  d.className = 'row';
  d.innerHTML = '<label>' + lab + '</label><input type=range><span class=v></span>';
  const [r, v] = [d.querySelector('input'), d.querySelector('.v')];
  Object.assign(r, { min, max, step, value: get() });
  const show = () => { v.textContent = (+get()).toFixed(step < 1 ? 1 : 0); };
  r.oninput = () => { set(+r.value); show(); if (pinned) place(); };
  show();
  return d;
};

const build = () => {
  panel.innerHTML = '';
  const h = (t) => { const e = document.createElement('h2'); e.textContent = t; panel.append(e); };
  const note = document.createElement('div');
  note.id = 'note';
  note.textContent = 'The dish on the right is the game’s own minimap, magnified out ' +
    'of the frame it just drew. The Warden is near-black on a near-black dish, so its ' +
    'blip carries a white ring; nothing else does.';
  panel.append(note);

  h('put one on the field');
  const b1 = document.createElement('div');
  b1.className = 'btns';
  NAMES.forEach((n, k) => {
    const b = document.createElement('button');
    b.innerHTML = '<span class=sw style="background:rgb(' + C._TYPES[k][9] + ')"></span>' + n;
    b.onclick = () => { field.push({ k, a: Math.random() * 2 * Math.PI }); place(); tally(); };
    b1.append(b);
  });
  panel.append(b1);

  const b2 = document.createElement('div');
  b2.className = 'btns';
  const ring = document.createElement('button');
  ring.textContent = 'one of each';
  ring.onclick = () => {
    field.length = 0;
    NAMES.forEach((_, k) => field.push({ k, a: k * 2 * Math.PI / 5 }));
    place(); tally();
  };
  const clear = document.createElement('button');
  clear.textContent = 'clear';
  clear.onclick = () => { field.length = 0; place(); tally(); };
  b2.append(ring, clear);
  panel.append(b2);

  const st = document.createElement('div');
  st.id = 'field';
  panel.append(st);

  h('where they stand');
  panel.append(row('metres', 1, C._ARENA, 0.5, () => dist, (v) => (dist = v)));
  panel.append(row('turn', 0, 6.28, 0.05, () => spin, (v) => (spin = v)));
  const b3 = document.createElement('div');
  b3.className = 'btns';
  const pin = document.createElement('button');
  pin.textContent = 'held still';
  pin.className = 'on';
  pin.onclick = () => { pinned = !pinned; pin.className = pinned ? 'on' : ''; };
  b3.append(pin);
  panel.append(b3);

  h('the rainbow');
  const b4 = document.createElement('div');
  b4.className = 'btns';
  const cast = document.createElement('button');
  cast.textContent = 'cast it on them';
  // Through the game's own charge, not by writing the hold onto the ghosts: a
  // Warden must be seen to SHRUG rather than be told it did.
  cast.onclick = () => {
    M.setBind(0);
    dispatchEvent(new KeyboardEvent('keydown', { code: 'Space' }));
    setTimeout(() => dispatchEvent(new KeyboardEvent('keyup', { code: 'Space' })), 3600);
  };
  b4.append(cast);
  panel.append(b4);

  h('the view');
  panel.append(row('magnify', 2, 10, 1, () => mag, (v) => { mag = v; fit(); }));
  tally();
};

const tally = () => {
  const st = $('field');
  if (!st) return;
  const n = {};
  for (const f of field) n[f.k] = (n[f.k] || 0) + 1;
  st.innerHTML = field.length
    ? Object.keys(n).map((k) => '<b>' + n[k] + '</b> ' + NAMES[k]).join(' &middot; ')
    : 'nothing on the field';
};

// --- the magnifier -------------------------------------------------------------
// The dish sits MAPPAD in from the top-left corner with a radius of MAPR of the
// short side, all in CSS pixels - the canvas backing store is devicePixelRatio
// times that, which is what the crop has to be in.
const dishRect = () => {
  // innerWidth/innerHeight off globalThis, the same place the game's own resize()
  // reads them - tests/edcheck.mjs runs this page in a stub that has those and no
  // `window` to hang them on.
  const d = cv.width / (globalThis.innerWidth || 1);
  const r = C._MAPR * (globalThis.innerHeight || 1);
  const pad = C._MAPPAD;
  const s = (2 * r + 2 * pad) * d;
  return [0, 0, s, s];
};
const fit = () => {
  const [, , s] = dishRect();
  const px = Math.round(s * mag / (cv.width / (globalThis.innerWidth || 1)));
  zoom.width = zoom.height = Math.round(s);
  zoom.style.width = zoom.style.height = px + 'px';
  const cap = $('cap');
  cap.style.top = (18 + px + 8) + 'px';
  cap.textContent = 'the game’s own dish at ' + mag + '×';
};

const paint = () => {
  if (pinned) place();
  const [x, y, w, h] = dishRect();
  zg.clearRect(0, 0, zoom.width, zoom.height);
  zg.drawImage(cv, x, y, w, h, 0, 0, zoom.width, zoom.height);
  requestAnimationFrame(paint);
};

addEventListener('resize', fit);

// Straight into a run, which is the only screen the minimap is drawn on, and with
// the horn switched off so nothing shoots the thing being looked at.
M.restart();
M.setFire(0);
M.look(0, 0);
NAMES.forEach((_, k) => field.push({ k, a: k * 2 * Math.PI / 5 }));
place();
build();
fit();
requestAnimationFrame(paint);
</script>
</body>
</html>
