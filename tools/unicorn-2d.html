<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>unicorn — 2D candidate</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a14;overflow:hidden;font:12px/1.5 monospace;color:#cfd6f5}
  canvas{display:block;position:absolute;inset:0}
  #o{pointer-events:none}
  #panel{position:absolute;top:0;right:0;width:340px;height:100%;overflow:auto;
         background:#0d101aee;border-left:1px solid #1e2233;padding:10px 12px}
  #panel.hid{display:none}
  #grip{position:absolute;top:8px;right:8px;z-index:5;background:#1b2133;border:1px solid #2b3350;
        color:#cfd6f5;padding:2px 8px;cursor:pointer}
  h2{font-size:11px;color:#ffd60a;letter-spacing:.1em;margin:14px 0 6px;text-transform:uppercase}
  .row{display:flex;align-items:center;gap:6px;margin:6px 0}
  .row label{width:56px;color:#8b93b8;flex:none}
  .row input[type=range]{flex:1;min-width:0;accent-color:#ff3b6b}
  .row input[type=number]{width:72px;flex:none;background:#070810;color:#fff;
    border:1px solid #2b3350;font:inherit;padding:2px 4px;text-align:right}
  .row input[type=number]::-webkit-outer-spin-button,
  .row input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .nudge{flex:none;width:22px;padding:2px 0;margin:0;text-align:center}
  button{background:#1b2133;color:#cfd6f5;border:1px solid #2b3350;padding:4px 9px;cursor:pointer;
         font:inherit;margin:2px 3px 2px 0}
  button.on{background:#ffd60a;color:#111;border-color:#ffd60a}
  #out{margin-top:10px;padding:8px;background:#070810;border:1px solid #1e2233;color:#7de08a;
       white-space:pre-wrap;font-size:11px}
  .note{color:#8b93b8;font-size:11px;margin:6px 0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="o"></canvas>
<div id="grip">&rsaquo;</div>
<div id="panel"></div>

<script type="module">
// Same contract as the other editors: this drives the GAME, not a copy. The game
// takes over #c and runs its own loop; the candidate is painted onto a second
// canvas laid over it, so there is no fighting over frame order.
const M = await import('/src/main.js');
const { C } = M;

// The unicorn is IN the game now, so this no longer paints a candidate over the
// top: it moves the real constants and the game draws itself. The overlay is
// only guides.

// Solved, not guessed: these put the sprite's horn exactly on the line the 3D
// horn drew. The model's own origin IS its horn tip, so x/y place the tip and
// rotation pivots on it.
// The placement the user settled on, 2026-08-31. These are the defaults; anything
// tuned on top of them is kept in localStorage, so a reload never throws the
// tuning away again.
// _UX, _UY and _US are fractions of the screen height so they survive a change
// of resolution; _UROT is radians. The panel converts on the way in and out.
const KEYS = ['_US', '_UX', '_UY', '_UROT'];
const DEF = {};
KEYS.forEach((k) => (DEF[k] = C[k]));
// Only restore keys this editor owns, and only from the CURRENT key. _UX used to
// mean "from the left edge" and now means "from the centre", so an older save is
// not merely stale - applying it throws the unicorn clean off the side. The key
// name carries the meaning, so a change of meaning gets a new name.
// Values are sanity-checked too: anything outside the slider's own range is
// ignored rather than trusted.
try {
  const saved = JSON.parse(localStorage.uni2dc || '{}');
  const SANE = { _US: [0.001, 0.03], _UX: [-1.5, 1.5], _UY: [-1, 2], _UROT: [-2, 2] };
  KEYS.forEach((k) => {
    const v = saved[k];
    if (typeof v === 'number' && isFinite(v) && v >= SANE[k][0] && v <= SANE[k][1]) C[k] = v;
  });
} catch (e) {}
const save = () => {
  try { localStorage.uni2dc = JSON.stringify(Object.fromEntries(KEYS.map((k) => [k, C[k]]))); }
  catch (e) {}
};
const DEG = 180 / Math.PI;
let guide = 1;
const $ = (id) => document.getElementById(id);
const panel = $('panel');
const SYNC = [];
const sync = () => SYNC.forEach((f) => f());
const o = $('o'), g = o.getContext('2d');

const h2 = (t) => { const e = document.createElement('h2'); e.textContent = t; panel.append(e); };
const note = (t) => { const e = document.createElement('div'); e.className = 'note'; e.textContent = t; panel.append(e); };
// A slider spanning the whole plausible range makes a one-pixel drag a big jump,
// so each control carries three ways in: the slider for coarse, a typed box for
// exact, and a pair of nudges that move by one step. FINE narrows every slider to
// a tight window around where it currently sits, which is where the precision is
// actually wanted - the coarse range is only needed once.
let FINE = 0;
const RANGES = [];
const slider = (label, key, lo, hi, st, dp, fineSpan, to = (v) => v, from = (v) => v) => {
  const row = document.createElement('div'); row.className = 'row';
  const l = document.createElement('label'); l.textContent = label;
  const i = document.createElement('input');
  i.type = 'range'; i.step = st;
  const n = document.createElement('input');
  n.type = 'number'; n.step = st;
  const dec = document.createElement('button'); dec.className = 'nudge'; dec.textContent = '-';
  const inc = document.createElement('button'); dec.title = 'one step down';
  inc.className = 'nudge'; inc.textContent = '+'; inc.title = 'one step up';

  const get = () => to(C[key]);
  const bound = () => {
    if (FINE) { i.min = get() - fineSpan; i.max = get() + fineSpan; }
    else { i.min = lo; i.max = hi; }
  };
  const show = () => { i.value = get(); n.value = get().toFixed(dp); };
  const set = (v, rebound) => {
    C[key] = from(Math.round(v / st) * st);
    if (rebound) bound();
    show(); save();
  };
  bound(); show();
  i.oninput = () => set(+i.value, 0);
  // rebound only when the drag ENDS, or the window would slide out from under
  // the thumb mid-drag and the control would run away.
  i.onchange = () => set(+i.value, 1);
  n.oninput = () => { if (n.value !== '') set(+n.value, 0); };
  n.onchange = () => set(+n.value, 1);
  dec.onclick = () => set(get() - st, 1);
  inc.onclick = () => set(get() + st, 1);

  row.append(l, i, dec, inc, n); panel.append(row);
  SYNC.push(() => { bound(); show(); });
  RANGES.push(bound);
};
const btn = (label, fn, on) => {
  const b = document.createElement('button');
  b.textContent = label; if (on) b.classList.add('on');
  b.onclick = () => fn(b); panel.append(b); return b;
};

const paint = () => {
  const dpr = devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  if (o.width !== (W * dpr | 0)) {
    o.width = W * dpr; o.height = H * dpr;
    o.style.width = W + 'px'; o.style.height = H + 'px';
  }
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  if (guide) {
    const sp = M.sprite(), a = M.aimPoint(), [dx, dy] = hornDir();
    g.lineWidth = 1;
    g.strokeStyle = '#7de08a';                    // the line the drawn horn casts
    g.beginPath(); g.moveTo(sp.tip[0], sp.tip[1]);
    g.lineTo(sp.tip[0] + 3000 * dx, sp.tip[1] + 3000 * dy); g.stroke();
    g.strokeStyle = '#ff3b6b';                    // where shots actually converge
    g.beginPath(); g.arc(a[0], a[1], 9, 0, 7);
    g.moveTo(a[0] - 16, a[1]); g.lineTo(a[0] - 5, a[1]);
    g.moveTo(a[0] + 5, a[1]); g.lineTo(a[0] + 16, a[1]);
    g.moveTo(a[0], a[1] - 16); g.lineTo(a[0], a[1] - 5);
    g.moveTo(a[0], a[1] + 5); g.lineTo(a[0], a[1] + 16);
    g.stroke();
    g.strokeStyle = '#ffffff88';                  // and the dead centre, by eye
    g.beginPath();
    g.moveTo(W / 2 - 22, H / 2); g.lineTo(W / 2 + 22, H / 2);
    g.moveTo(W / 2, H / 2 - 22); g.lineTo(W / 2, H / 2 + 22);
    g.stroke();
  }
  requestAnimationFrame(paint);
};


h2('placement');
slider('scale', '_US', 0.002, 0.02, 0.0001, 4, 0.0008);
slider('x', '_UX', -0.8, 1.2, 0.001, 3, 0.04);
slider('y', '_UY', -0.4, 1.2, 0.001, 3, 0.04);
slider('rotation', '_UROT', -60, 60, 0.01, 2, 3, (v) => v * DEG, (v) => v / DEG);
btn('FINE off', (b) => {
  FINE = !FINE;
  b.classList.toggle('on', !!FINE);
  b.textContent = FINE ? 'FINE on - narrow range' : 'FINE off - full range';
  RANGES.forEach((f) => f());
});
note('drag for coarse, - and + for one step, or type an exact value. FINE narrows every slider to a small window around where it sits. A focused slider also takes arrow keys, one step each.');
note('x and y place the HORN TIP, and rotation pivots on it - the model origin is the tip. Rotation shows degrees and stores radians.');
note('x is measured from the CENTRE of the window, so the pose holds at any aspect ratio. Scale and y are fractions of the height; y counts UP from the bottom.');

h2('compare');
btn('ghosts on', (b) => {
  const on = C._SPAWN < 1e8;
  b.classList.toggle('on', on);
  b.textContent = on ? 'ghosts off' : 'ghosts on';
  C._SPAWN = on ? 1e9 : OS;
  if (on) M.place([]);
}, 1);
btn('guides on', (b) => {
  guide = !guide;
  b.classList.toggle('on', !!guide);
  b.textContent = guide ? 'guides on' : 'guides off';
}, 1);
btn('back to the shipped pose', () => { Object.assign(C, DEF); sync(); save(); });
btn('restart', () => M.restart());

const out = document.createElement('pre'); out.id = 'out'; panel.append(out);
// The horn's direction on screen, read off the sprite's own axis constant and
// its rotation - the same two numbers puppet() draws from.
const hornDir = () => {
  const ca = Math.cos(C._UROT), sa = Math.sin(C._UROT);
  return [-(C._UHA[0] * ca - C._UHA[1] * sa), -(C._UHA[0] * sa + C._UHA[1] * ca)];
};
// How far the horn's line passes from a point on screen. Positive means the horn
// points below it.
const missAt = (cx, cy) => {
  const tip = M.sprite().tip, [dx, dy] = hornDir();
  return tip[1] + (cx - tip[0]) / dx * dy - cy;
};
const miss = () => missAt(...M.aimPoint());
const tick = () => {
  const m = miss();
  const L = [
    '_US: ' + C._US.toFixed(4) + ',',
    '_UX: ' + C._UX.toFixed(4) + ',',
    '_UY: ' + C._UY.toFixed(4) + ',',
    '_UROT: ' + C._UROT.toFixed(4) + ',',
    '',
    'window ' + innerWidth + ' x ' + innerHeight +
      '   (aspect ' + (innerWidth / innerHeight).toFixed(2) + ')',
    'horn tip at ' + M.sprite().tip.map((v) => v.toFixed(0)).join(', ') +
      ', ' + (93 * M.sprite().scale).toFixed(0) + 'px tall',
    '',
    M.sprite().paths + ' paths, ' + M.sprite().mane + ' of them mane.',
    '',
    (Math.abs(m) < 6 ? 'HORN ON THE RETICLE' :
      'horn misses the reticle by ' + m.toFixed(0) + 'px'),
    '(negative = pointing above it)',
    '',
    'paste the four lines above to Claude.',
  ];
  out.textContent = L.join(String.fromCharCode(10));
  requestAnimationFrame(tick);
};

const OS = C._SPAWN;
$('grip').onclick = () => {
  panel.classList.toggle('hid');
  $('grip').textContent = panel.classList.contains('hid') ? '<' : '>';
};
paint(); tick();
</script>
</body>
</html>
