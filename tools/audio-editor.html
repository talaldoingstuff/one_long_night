<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>audio editor</title>
<style>
  html,body{margin:0;height:100%;background:#05060e;overflow:hidden;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#c8cee6}
  canvas#c{display:block;position:fixed;inset:0}
  #panel{position:fixed;top:0;left:0;bottom:0;width:344px;background:#0c0e18f2;border-right:1px solid #232a44;
         overflow-y:auto;padding:10px 12px 40px;box-shadow:8px 0 24px #0008;transition:transform .18s}
  #panel.hid{transform:translateX(-332px)}
  #grip{position:fixed;top:0;left:344px;width:12px;height:100%;cursor:col-resize;background:#161c30;
        border-left:1px solid #232a44;transition:left .18s;display:flex;align-items:center;justify-content:center;color:#6b7599}
  #grip.hid{left:12px}
  h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7f89b0;margin:16px 0 6px;
     border-bottom:1px solid #232a44;padding-bottom:4px}
  h2:first-child{margin-top:0}
  .row{display:grid;grid-template-columns:74px 1fr 66px;gap:6px;align-items:center;margin:2px 0}
  .row label{color:#8b93b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row input[type=range]{width:100%;accent-color:#34c9ff}
  .row select{width:100%;background:#131a2e;color:#c8cee6;border:1px solid #2e3860;border-radius:3px;font:inherit;padding:2px}
  .row .v{text-align:right;color:#e8ecf8;font-variant-numeric:tabular-nums}
  .btns{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}
  button{background:#1a2138;border:1px solid #2e3860;color:#c8cee6;
         padding:4px 8px;border-radius:4px;cursor:pointer;font:inherit}
  button:hover{background:#232c4a}
  button.on{background:#34c9ff;border-color:#34c9ff;color:#04121a}
  button.big{width:100%;padding:7px;margin:6px 0;background:#193043;border-color:#2b5b78;color:#9fe6ff}
  button.big.on{background:#34c9ff;color:#04121a}
  #env{width:100%;height:94px;display:block;background:#070912;border:1px solid #232a44;border-radius:4px;margin:6px 0}
  textarea{width:100%;height:190px;background:#070912;color:#9fb0d8;border:1px solid #232a44;
           border-radius:4px;font:11px/1.45 ui-monospace,monospace;padding:6px;resize:vertical}
  #hint{position:fixed;left:370px;bottom:10px;color:#59618a}
  .note{color:#59618a;margin:4px 0 0;font-size:11px}
  #top{position:sticky;top:-10px;z-index:2;background:#0c0e18;margin:-10px -12px 4px;
       padding:10px 12px 8px;border-bottom:1px solid #232a44}
  .sec{display:block;width:100%;text-align:left;margin:5px 0 0;padding:6px 9px;
       background:#141a2c;border:1px solid #232a44;border-radius:4px;color:#8b93b8;
       font:11px/1.5 ui-monospace,monospace;letter-spacing:.13em;text-transform:uppercase}
  .sec:hover{background:#1b2338;color:#c8cee6}
  .sec.open{background:#1b2338;color:#9fe6ff;border-color:#2b4a63}
  .sec::before{content:'+ ';color:#59618a}
  .sec.open::before{content:'- '}
  .body{display:none;padding:4px 0 10px}
  .body.open{display:block}
  .desc{color:#9fe6ff;background:#101c28;border:1px solid #21384a;border-radius:4px;
        margin:6px 0 0;padding:6px 8px;line-height:1.55}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="grip">&rsaquo;</div>
<div id="panel"><div id="top"></div></div>
<div id="hint">the preview is the game itself - play it and tune what you hear</div>

<script type="module">
// Drives the GAME, not a copy of it. main.js takes over #c and runs its own loop,
// and this mutates the same C it reads on every sound it plays, so a slider moved
// here is heard in the next shot fired down there.
const M = await import('/src/main.js');
const { C } = M;

const $ = (id) => document.getElementById(id);
const panel = $('panel');

// A press that lands in the panel must not also reach the game: its listeners are
// on the window, so anything bubbling out of here arms the bind or restarts a
// finished run. pointerup is deliberately let through - if a drag on the canvas
// ends over the panel, swallowing the release would leave the game holding a
// button nobody is holding.
for (const t of ['pointerdown', 'pointermove']) panel.addEventListener(t, (e) => e.stopPropagation());

// Every sound, in the order the table has them. The name is what goes back into
// the comment column, so this list and the source stay in step.
const SFX = [
  'Every horn shot. Fires several times a second once SHOT RATE is levelled, so it has to stay out of the way.',
  'A horn landing on a ghost. One per hit, and the ghost flashes white on the same frame.',
  'A ghost dying.',
  'A ghost reaching you and taking a heart. The screen shakes and flashes red on the same frame.',
  'Any press: taking a card between waves, and the click that starts a new run. More buttons will use it.',
  'The last heart lost.',
];
// Named for the moment, not for the sound: two of these were impossible to find
// by ear because 'wave' and 'caught' said nothing about the rainbow.
const SHORT = ['horn shot', 'ghost hit', 'ghost killed', 'you get hit', 'click', 'game over'];
// The two that are more than one note. They live in _ARP, not _SFX, and have
// their own section - a chime is a list of intervals, not a shape.
const ARP = ['RAINBOW WAVE', 'wave cleared'];
const ARPD = [
  'The rainbow wave landing. Five notes ringing over each other into a shimmer - the ring is far longer than the gap, so they overlap rather than arpeggiate.',
  'The last ghost of a wave gone, however it went: killed, or having reached you and taken a heart. Going into the card screen.',
];
const FROM = 0, TO = 1, LEN = 2, VOL = 3, WAVE = 4;

let sel = 0;            // the sound the sliders are editing
let pan = 0;            // preview only - pan lives at the call site, not in the table
const ctl = [];         // everything that needs re-reading when the selection changes

// One long scroll of every control at once was unreadable. h2 now opens a folded
// section and everything built after it lands inside, so the panel shows one job
// at a time - which is also how it is actually used.
const top = $('top');
let group = top;
const h2 = (t) => {
  const head = document.createElement('button');
  head.className = 'sec';
  head.textContent = t;
  const body = document.createElement('div');
  body.className = 'body';
  panel.append(head, body);
  head.onclick = () => head.classList.toggle('open', body.classList.toggle('open'));
  group = body;
  return head;
};
const p = (t) => { const e = document.createElement('p'); e.className = 'note'; e.textContent = t; group.append(e); return e; };

const slider = (label, get, set, lo, hi, step, fmt) => {
  const row = document.createElement('div'); row.className = 'row';
  const l = document.createElement('label'); l.textContent = label;
  const i = document.createElement('input');
  i.type = 'range'; i.min = lo; i.max = hi; i.step = step;
  const v = document.createElement('div'); v.className = 'v';
  const sync = () => { i.value = get(); v.textContent = fmt(+get()); };
  i.oninput = () => { set(+i.value); sync(); drawEnv(); dump(); };
  row.append(l, i, v); group.append(row);
  sync.row = row;
  ctl.push(sync); sync();
  return sync;
};

const picker = (label, get, set, opts) => {
  const row = document.createElement('div'); row.className = 'row';
  const l = document.createElement('label'); l.textContent = label;
  const s = document.createElement('select');
  opts.forEach((o, n) => { const e = document.createElement('option'); e.value = n; e.textContent = o; s.append(e); });
  const v = document.createElement('div'); v.className = 'v';
  const sync = () => { s.value = get(); };
  s.onchange = () => { set(+s.value); drawEnv(); dump(); };
  row.append(l, s, v); group.append(row);
  ctl.push(sync); sync();
};

const btn = (t, fn, cls) => {
  const b = document.createElement('button');
  b.textContent = t; if (cls) b.className = cls; b.onclick = () => fn(b);
  return b;
};
const bar = (...bs) => { const d = document.createElement('div'); d.className = 'btns'; d.append(...bs); group.append(d); return d; };

// ---------------------------------------------------------------------------
// The context, and what the game is doing while you listen
// ---------------------------------------------------------------------------
let studio = 0, muted = 0;
// Silencing the music must not overwrite the number you tuned it to, so musV is
// the truth and C._MUSV is only what is currently playing. The slider and the
// paste-back both read musV, which means the value survives being muted and a
// copy taken while muted is still the right one.
let musOff = 0, musV = C._MUSV;
const applyMus = () => { C._MUSV = musOff ? 0 : musV; };
const enable = btn('CLICK HERE TO START THE SOUND', (b) => {
  M.startAudio();                                 // a context made outside a gesture is blocked
  b.textContent = 'sound is on';
  b.classList.add('on');
}, 'big');
group.append(enable);

slider('MASTER', () => C._VOL, (v) => (C._VOL = v), 0, 3, 0.05, (v) => v.toFixed(2) + 'x');

const mute = btn('mute', (b) => { muted ^= 1; M.setMuted(muted); b.classList.toggle('on', !!muted); });
const quiet = btn('studio', (b) => {
  studio ^= 1;
  M.setFire(!studio);                             // the puppet fires several times a second otherwise
  b.classList.toggle('on', !!studio);
});
const musBtn = btn('music off', (b) => {
  musOff ^= 1;
  applyMus();
  b.classList.toggle('on', !!musOff);
  b.textContent = musOff ? 'music OFF' : 'music off';
});
const sfxBtn = btn('sfx off', (b) => {
  C._SFXV ^= 1;                                   // a master for the sounds alone
  b.classList.toggle('on', !C._SFXV);
  b.textContent = C._SFXV ? 'sfx off' : 'sfx OFF';
});
bar(mute, musBtn, sfxBtn, quiet, btn('clear the field', () => M.place([])), btn('restart', () => M.restart()));
p('music off and sfx off leave every volume alone - they are masters, not the sliders. studio stops the puppet auto-firing. A limiter across the output means nothing here can clip, only flatten.');

// ---------------------------------------------------------------------------
// One sound at a time
// ---------------------------------------------------------------------------
h2('sounds');
const pickRow = document.createElement('div'); pickRow.className = 'btns'; group.append(pickRow);
const pickBtns = SHORT.map((s, i) => {
  const b = btn(s, () => {
    sel = i;
    pickBtns.forEach((q, n) => q.classList.toggle('on', n === i));
    ctl.forEach((f) => f());
    desc.textContent = SFX[i];
    drawEnv();
    play();
  });
  pickRow.append(b);
  return b;
});
pickBtns[0].classList.add('on');

const desc = document.createElement('p');
desc.className = 'desc';
desc.textContent = SFX[0];
group.append(desc);

const env = document.createElement('canvas');
env.id = 'env'; env.width = 640; env.height = 188;
group.append(env);
const ec = env.getContext('2d');

const S = () => C._SFX[sel];
slider('from', () => S()[FROM], (v) => (S()[FROM] = v), 20, 2000, 1, (v) => v + ' Hz');
slider('to', () => S()[TO], (v) => (S()[TO] = v), 20, 2000, 1, (v) => v + ' Hz');
slider('length', () => S()[LEN], (v) => (S()[LEN] = v), 0.02, 1.5, 0.005, (v) => v.toFixed(3) + 's');
slider('volume', () => S()[VOL], (v) => (S()[VOL] = v), 0, 1.4, 0.005, (v) => v.toFixed(3));
picker('wave', () => S()[WAVE], (v) => (S()[WAVE] = v), C._OSC);
slider('noise band', () => C._NQ, (v) => (C._NQ = v), 0.2, 12, 0.1, (v) => 'Q ' + v.toFixed(1));
slider('attack', () => C._ATK, (v) => (C._ATK = v), 0.001, 0.08, 0.001, (v) => v.toFixed(3) + 's');
slider('pan (preview)', () => pan, (v) => (pan = v), -1, 1, 0.05, (v) => v.toFixed(2));

const play = () => M.playSfx(sel, pan);
bar(btn('play', play), btn('play all', async () => {
  for (let i = 0; i < SFX.length; i++) {
    M.playSfx(i, 0);
    await new Promise((r) => setTimeout(r, 480));
  }
}));
p('wave = noise makes from/to sweep a band across a rush of air instead of a pitch. noise band and attack are shared by every sound. Bake MASTER back into the numbers rather than leaving a correction on it.');

// ---------------------------------------------------------------------------
// The rainbow charge - a series, not a sound
// ---------------------------------------------------------------------------
h2('rainbow charge');
slider('root', () => C._CHG[FROM], (v) => (C._CHG[FROM] = v), 180, 1200, 1, (v) => v + ' Hz');
slider('steps', () => C._CHG[TO], (v) => (C._CHG[TO] = v), 3, 24, 1, (v) => v + ' notes');
slider('ring', () => C._CHG[LEN], (v) => (C._CHG[LEN] = v), 0.05, 1.5, 0.01, (v) => v.toFixed(2) + 's');
slider('volume', () => C._CHG[VOL], (v) => (C._CHG[VOL] = v), 0, 1, 0.005, (v) => v.toFixed(3));
picker('wave', () => C._CHG[WAVE], (v) => (C._CHG[WAVE] = v), C._OSC);
slider('gap at 0%', () => C._CHGGAP[0], (v) => (C._CHGGAP[0] = v), 0.02, 0.8, 0.01, (v) => v.toFixed(2) + 's');
slider('gap at 100%', () => C._CHGGAP[1], (v) => (C._CHGGAP[1] = v), 0.02, 0.8, 0.01, (v) => v.toFixed(2) + 's');

// Runs the real chargeTick on a real clock, so the acceleration heard here is the
// acceleration the game produces - the editor schedules nothing of its own.
let running = 0;
const runCharge = async () => {
  if (running) return;
  running = 1;
  M.resetCharge();                                // the ladder is a counter now
  const t0 = performance.now();
  for (let k = 0; k < 1;) {
    k = Math.min(1, (performance.now() - t0) / (C._BINDCHG * 1000));
    const gap = M.playCharge(k);
    await new Promise((r) => setTimeout(r, gap * 1000));
  }
  M.playSfx(3);                                   // and the wave it has been building to
  running = 0;
};
bar(btn('play the whole charge', runCharge),
    btn('first note', () => { M.resetCharge(); M.playCharge(0); }),
    btn('next note', () => M.playCharge(1)));
p('One note per tick, off the music scale, wrapping an octave each time round. The ring far outlasts the gap, so they pile into a shimmer that thickens as it fills.');

// ---------------------------------------------------------------------------
// The two sounds that are notes rather than a shape
// ---------------------------------------------------------------------------
h2('chimes');
let asel = 0;
const Q = () => C._ARP[asel];
const adesc = document.createElement('p');
adesc.className = 'desc';
adesc.textContent = ARPD[0];
const arpRow = document.createElement('div'); arpRow.className = 'btns'; group.append(arpRow);
const arpBtns = ARP.map((n, i) => {
  const b = btn(n, () => {
    asel = i;
    arpBtns.forEach((q, k) => q.classList.toggle('on', k === i));
    adesc.textContent = ARPD[i];
    ctl.forEach((f) => f());
    noteRows();
    M.playArp(i);
  });
  arpRow.append(b);
  return b;
});
arpBtns[0].classList.add('on');
group.append(adesc);

slider('root', () => Q()[1], (v) => (Q()[1] = v), 180, 1600, 1, (v) => v + ' Hz');
slider('spacing', () => Q()[2], (v) => (Q()[2] = v), 0.01, 0.4, 0.005, (v) => v.toFixed(3) + 's');
slider('ring', () => Q()[3], (v) => (Q()[3] = v), 0.05, 2, 0.01, (v) => v.toFixed(2) + 's');
slider('volume', () => Q()[4], (v) => (Q()[4] = v), 0, 1.4, 0.005, (v) => v.toFixed(3));
picker('wave', () => Q()[5], (v) => (Q()[5] = v), C._OSC);
const nSync = slider('notes', () => Q()[0].length, (v) => {
  const a = Q()[0];
  while (a.length < v) a.push(a[a.length - 1] + 5);
  while (a.length > v) a.pop();
  ctl.forEach((f) => f());
  noteRows();
}, 1, 6, 1, (v) => v + '');
const noteS = [];
for (let n = 0; n < 6; n++) {
  noteS.push(slider('note ' + (n + 1), () => Q()[0][n] || 0,
    (v) => { if (n < Q()[0].length) Q()[0][n] = v; }, 0, 36, 1, (v) => '+' + v + ' st'));
}
// A row for an interval the chime does not have would just be a slider that does
// nothing, so the ones past the count are taken off the panel instead.
const noteRows = () => noteS.forEach((f, n) => { f.row.style.display = n < Q()[0].length ? '' : 'none'; });
noteRows();
bar(btn('play', () => M.playArp(asel)));
p('Ring much longer than spacing shimmers; shorter arpeggiates. 0 4 7 12 major, 0 3 7 12 minor, 0 7 12 19 24 the open one the rainbow uses.');

// ---------------------------------------------------------------------------
// Music
// ---------------------------------------------------------------------------
h2('music');
// Five takes on the same piece - Am Am F G / Am Am C E, six notes a bar, hat on
// from the start. They differ in what is PLAYING it, not in what is played: the
// sine lead was the whole of what made it sound like a toy. Degrees are scale
// steps, so degree 4 is the fifth of whatever chord it lands on; durations are
// sixteenths and add up to sixteen, one bar.
const DRIVE = [[0, 1], [0, 1], [8, 0], [10, 0], [0, 1], [0, 1], [3, 0], [7, 0]];
const PIECES = [
  ['Grit', 'The chosen one. The lead is noise rather than a pitch - the tune is played by a band swept across a rush of air, so it has grit instead of tone. Its level is over 1 because a bandpass throws most of a noise away; measured, it lands level with the bass.',
   { PROG: DRIVE, MOTIF: [[4, 2], [3, 2], [2, 2], [4, 2], [7, 4], [4, 4]], BPM: [120, 160], V: 0.720,
     BASS: [110, 4, 0.55, 2], LEAD: [330, 1.10, 4], HAT: [9000, 0.10, 4, 0], KEY: [4, 6] }],
  ['Saw', 'The straight fix: a sawtooth lead an octave down from the sine, with a saw bass under it. Buzzy where the sine was glassy, and the same tune. Start here.',
   { PROG: DRIVE, MOTIF: [[4, 2], [3, 2], [2, 2], [4, 2], [7, 4], [4, 4]], BPM: [88, 126], V: 0.200,
     BASS: [110, 4, 0.55, 2], LEAD: [220, 0.55, 2], HAT: [7500, 0.09, 4, 0], KEY: [4, 6] }],
  ['Square', 'A square lead is nasal rather than glassy - chiptune with teeth. It cuts through the shots at a lower level than anything else here, because a square is all odd harmonics and nothing else is competing up there.',
   { PROG: DRIVE, MOTIF: [[4, 2], [3, 2], [2, 2], [4, 2], [7, 4], [4, 4]], BPM: [88, 126], V: 0.200,
     BASS: [110, 4, 0.50, 1], LEAD: [220, 0.45, 1], HAT: [7500, 0.09, 4, 0], KEY: [4, 6] }],
  ['Low', 'The whole thing moved down a register: lead at 165, bass at 82, and a darker hat. Less tune, more engine - the melody stops being the thing you notice and the movement underneath takes over.',
   { PROG: DRIVE, MOTIF: [[4, 2], [3, 2], [2, 2], [4, 2], [7, 4], [4, 4]], BPM: [88, 126], V: 0.200,
     BASS: [82, 4, 0.60, 2], LEAD: [165, 0.60, 2], HAT: [5200, 0.08, 4, 0], KEY: [4, 6] }],
  ['Hammer', 'The tune stops being a tune: it hits the root four times before it goes anywhere, at the fastest tempo here. A square bass under a saw lead. This is the one that sounds like it is chasing you.',
   { PROG: DRIVE, MOTIF: [[0, 2], [0, 2], [3, 2], [0, 2], [0, 4], [4, 4]], BPM: [128, 176], V: 0.190,
     BASS: [110, 2, 0.45, 1], LEAD: [220, 0.55, 2], HAT: [7500, 0.10, 4, 0], KEY: [4, 6] }],
];


const NOTE = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const chord = (ch) => NOTE[(9 + ch[0]) % 12] + (ch[1] ? 'm' : '');
const score = document.createElement('p');
score.className = 'desc';
const pdesc = document.createElement('p');
pdesc.className = 'note';
const showScore = () => {
  score.textContent = C._PROG.map(chord).join(' - ') + '   |   ' +
    C._MOTIF.map(([d, n]) => 'deg ' + d + ' x' + n).join(', ');
};
const pieceRow = document.createElement('div'); pieceRow.className = 'btns'; group.append(pieceRow);
const pieceBtns = PIECES.map(([name, why, v], i2) => {
  const b = btn(name, () => {
    C._PROG = v.PROG.map((r) => r.slice());
    C._MOTIF = v.MOTIF.map((r) => r.slice());
    C._BPM = v.BPM.slice(); C._MBASS = v.BASS.slice();
    C._MLEAD = v.LEAD.slice(); C._MHAT = v.HAT.slice(); C._MKEY = v.KEY.slice();
    musV = v.V; applyMus();
    pieceBtns.forEach((q, k) => q.classList.toggle('on', k === i2));
    pdesc.textContent = why;
    showScore();
    ctl.forEach((f) => f());
    dump();
  });
  pieceRow.append(b);
  return b;
});
pieceBtns[0].classList.add('on');
pdesc.textContent = PIECES[0][1];
group.append(score, pdesc);

slider('music vol', () => musV, (v) => { musV = v; applyMus(); }, 0, 1.5, 0.01, (v) => v.toFixed(2));
slider('BPM at wave 1', () => C._BPM[0], (v) => (C._BPM[0] = v), 40, 160, 1, (v) => v + '');
slider('BPM at wave 30', () => C._BPM[1], (v) => (C._BPM[1] = v), 40, 200, 1, (v) => v + '');
slider('key lift', () => C._MKEY[1], (v) => (C._MKEY[1] = v), 0, 12, 1, (v) => '+' + v + ' st');
slider('lift every', () => C._MKEY[0], (v) => (C._MKEY[0] = v), 1, 12, 1, (v) => v + ' waves');

slider('bass note', () => C._MBASS[0], (v) => (C._MBASS[0] = v), 55, 330, 1, (v) => v + ' Hz');
slider('bass every', () => C._MBASS[1], (v) => (C._MBASS[1] = v), 1, 16, 1, (v) => v + '/16');
slider('bass level', () => C._MBASS[2], (v) => (C._MBASS[2] = v), 0, 1.5, 0.05, (v) => v.toFixed(2));
picker('bass wave', () => C._MBASS[3], (v) => (C._MBASS[3] = v), C._OSC);

slider('lead note', () => C._MLEAD[0], (v) => (C._MLEAD[0] = v), 130, 660, 1, (v) => v + ' Hz');
slider('lead level', () => C._MLEAD[1], (v) => (C._MLEAD[1] = v), 0, 1.5, 0.05, (v) => v.toFixed(2));
picker('lead wave', () => C._MLEAD[2], (v) => (C._MLEAD[2] = v), C._OSC);

slider('hat level', () => C._MHAT[1], (v) => (C._MHAT[1] = v), 0, 0.5, 0.005, (v) => v.toFixed(3));
slider('hat enters at', () => C._MHAT[3], (v) => (C._MHAT[3] = v), 0, 1, 0.05,
       (v) => (v ? Math.round(v * C._MUSTHR) + ' ghosts' : 'always'));
slider('full threat at', () => C._MUSTHR, (v) => (C._MUSTHR = v), 1, 16, 1, (v) => v + ' ghosts');

let wv = 1;
slider('wave', () => wv, (v) => { wv = v; M.setWave(v); }, 1, 36, 1, (v) => v + '');
p('The hat is a layer that arrives: it comes in when the field is against you and drops out when you clear it. Drag wave to hear the key lift and the tempo climb.');
showScore();

// ---------------------------------------------------------------------------
// The envelope, drawn
// ---------------------------------------------------------------------------
// Not decoration: what decides the character of a very short sound is the pitch
// it sweeps through and how fast it gets out of the way, and neither of those is
// legible as a pair of slider readouts.
function drawEnv() {
  const q = S(), w = env.width, h = env.height;
  const dur = q[LEN], span = dur * 1.12;
  ec.fillStyle = '#070912';
  ec.fillRect(0, 0, w, h);

  const LO = 20, HI = 4000;
  const fy = (f) => h - 10 - (h - 26) *
    (Math.log(Math.max(LO, Math.min(HI, f))) - Math.log(LO)) / (Math.log(HI) - Math.log(LO));
  ec.strokeStyle = '#161d33';
  ec.lineWidth = 1;
  for (const f of [50, 100, 200, 400, 800, 1600, 3200]) {
    ec.beginPath(); ec.moveTo(0, fy(f)); ec.lineTo(w, fy(f)); ec.stroke();
  }

  // the envelope as an area: linear up over ATK, exponential down to nothing
  const amp = (t) => (t < C._ATK ? q[VOL] * t / C._ATK
    : q[VOL] * (1e-4 / q[VOL]) ** ((t - C._ATK) / Math.max(1e-4, dur - C._ATK)));
  ec.fillStyle = 'rgba(52,201,255,0.16)';
  ec.beginPath();
  ec.moveTo(0, h);
  for (let x = 0; x <= w; x++) {
    const t = x / w * span;
    ec.lineTo(x, h - (h - 14) * Math.min(1, amp(Math.min(t, dur)) / 1.4) * (t > dur ? 0 : 1));
  }
  ec.lineTo(w, h);
  ec.fill();

  // the pitch it sweeps through
  ec.strokeStyle = '#ffd60a';
  ec.lineWidth = 2;
  ec.beginPath();
  for (let x = 0; x <= w; x++) {
    const t = x / w * span;
    if (t > dur) break;
    const f = q[FROM] * (Math.max(1, q[TO]) / q[FROM]) ** (t / dur);
    if (x) ec.lineTo(x, fy(f)); else ec.moveTo(x, fy(f));
  }
  ec.stroke();

  ec.fillStyle = '#7f89b0';
  ec.font = '11px ui-monospace,monospace';
  ec.fillText(SHORT[sel] + ' - ' + q[FROM] + ' to ' + q[TO] + ' Hz over ' + dur.toFixed(3) + 's, ' +
              C._OSC[q[WAVE]] + ', ' + q[VOL].toFixed(3), 8, 14);
  ec.fillText(SFX[sel], 8, h - 6);
}

// ---------------------------------------------------------------------------
// Paste back
// ---------------------------------------------------------------------------
h2('paste back into C');
const out = document.createElement('textarea');
group.append(out);
bar(btn('copy', () => navigator.clipboard.writeText(out.value)));

const NL = String.fromCharCode(10);
const n3 = (v) => (+v).toFixed(3);
const pad = (s, n) => String(s).padStart(n);

function dump() {
  out.value =
    "  _OSC: ['sine', 'square', 'sawtooth', 'triangle'],\n" +
    '  _VOL: ' + (+C._VOL).toFixed(2) + ',' + NL +
    '  _SFXV: ' + (+C._SFXV).toFixed(2) + ',' + NL +
    '  _LIM: [' + C._LIM.join(', ') + '],' + NL +
    '  _SFX: [\n' +
    C._SFX.map((q, i) =>
      '    [' + pad(q[FROM], 3) + ', ' + pad(q[TO], 4) + ', ' + n3(q[LEN]) + ', ' +
      n3(q[VOL]) + ', ' + q[WAVE] + '],   // ' + pad(i, 2) + '  ' + SFX[i]).join('\n') +
    '\n  ],\n' +
    '  _ATK: ' + n3(C._ATK) + ',\n' +
    '  _NQ: ' + (+C._NQ).toFixed(1) + ',\n' +
    '  _ARP: [' + NL +
    C._ARP.map((q, i) => '    [[' + q[0].join(', ') + '], ' + q[1] + ', ' +
      n3(q[2]) + ', ' + (+q[3]).toFixed(2) + ', ' + n3(q[4]) + ', ' + q[5] +
      '],   // ' + i + '  ' + ARP[i]).join(NL) + NL + '  ],\n' +
    '  _CHG: [' + C._CHG[FROM] + ', ' + C._CHG[TO] + ', ' + n3(C._CHG[LEN]) + ', ' +
      n3(C._CHG[VOL]) + ', ' + C._CHG[WAVE] + '],\n' +
    '  _CHGGAP: [' + (+C._CHGGAP[0]).toFixed(2) + ', ' + (+C._CHGGAP[1]).toFixed(2) + '],\n' +
    '  _MUSV: ' + n3(musV) + ',' + NL +
    '  _MAJ: [' + C._MAJ.join(', ') + '],' + NL +
    '  _MIN: [' + C._MIN.join(', ') + '],' + NL +
    '  _PROG: [' + C._PROG.map((c) => '[' + c.join(', ') + ']').join(', ') + '],' + NL +
    '  _MOTIF: [' + C._MOTIF.map((c) => '[' + c.join(', ') + ']').join(', ') + '],' + NL +
    '  _BPM: [' + C._BPM.join(', ') + '],' + NL +
    '  _MUSW: ' + C._MUSW + ',' + NL +
    '  _MKEY: [' + C._MKEY.join(', ') + '],' + NL +
    '  _MBASS: [' + C._MBASS[0] + ', ' + C._MBASS[1] + ', ' + (+C._MBASS[2]).toFixed(2) + ', ' + C._MBASS[3] + '],' + NL +
    '  _MLEAD: [' + C._MLEAD[0] + ', ' + (+C._MLEAD[1]).toFixed(2) + ', ' + C._MLEAD[2] + '],' + NL +
    '  _MHAT: [' + C._MHAT[0] + ', ' + n3(C._MHAT[1]) + ', ' + C._MHAT[2] + ', ' + (+C._MHAT[3]).toFixed(2) + '],' + NL +
    '  _MUSTHR: ' + C._MUSTHR + ',' + NL +
    '  _MUSSCALE: [' + C._MUSSCALE.join(', ') + '],';
}

// ---------------------------------------------------------------------------
$('grip').onclick = () => {
  const hid = panel.classList.toggle('hid');
  $('grip').classList.toggle('hid');
  $('grip').innerHTML = hid ? '&rsaquo;' : '&lsaquo;';
};
// Something has to be open or the panel reads as broken; sounds is the one
// anybody opens the page for.
panel.querySelector('.sec').click();
drawEnv();
dump();
</script>
