<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>font preview</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#2a1826;
            font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#c8cee6}
  #c{display:none}
  #p{position:fixed;inset:0;cursor:pointer}
</style>
</head>
<body>
<!-- main.js claims the canvas called c and runs the game on it; give it one of
     its own, out of sight, so it cannot draw over the preview -->
<canvas id="c"></canvas>
<canvas id="p"></canvas>
<script type="module">
// A webfont is an external resource and the jam forbids one, so the whole menu of
// options is what the machine already has. Only faces that actually RESOLVE
// DIFFERENTLY are listed - monospace, ui-monospace and Consolas all come out as
// one face here, and listing them separately just looks like a broken preview.
const M = await import('/src/main.js');
const C = M.C;
const cv = document.getElementById('p');
const g = cv.getContext('2d');

// face, and whether every character is the same width. The card titles size
// themselves with no measuring - 1.5 / title.length - which only holds for a
// fixed advance, so a proportional face is for titles and prose, never cards.
const FACES = [
  ['monospace', 1, 'SHIPS NOW'],
  ['Courier New,monospace', 1, 'the typewriter'],
  ['Lucida Console,monospace', 1, 'squarer, heavier'],
  ['system-ui,sans-serif', 0, 'the OS UI face'],
  ['Trebuchet MS,sans-serif', 0, 'friendly, humanist'],
  ['Verdana,sans-serif', 0, 'wide, very legible small'],
  ['Arial Black,sans-serif', 0, 'heavy poster sans'],
  ['Impact,fantasy', 0, 'condensed poster - not on Linux'],
  ['serif', 0, 'the storybook default'],
  ['Georgia,serif', 0, 'warmer storybook'],
  ['Palatino Linotype,serif', 0, 'a book face, older'],
  ['Papyrus,fantasy', 0, 'mythic, a fable'],
  ['Segoe Script,cursive', 0, 'handwritten'],
  ['cursive', 0, 'the OS handwriting face'],
];
const BASE = 'monospace'.length;
let focus = -1;

const draw = () => {
  const W = cv.width = innerWidth, H = cv.height = innerHeight;
  const grd = g.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, '#2a1826');
  grd.addColorStop(1, '#3a322b');
  g.fillStyle = grd;
  g.fillRect(0, 0, W, H);
  g.textAlign = 'left';
  g.textBaseline = 'alphabetic';
  const u = Math.min(W, H) * C._HUDU;      // the game's own unit

  if (focus >= 0) {
    const [face, mono, note] = FACES[focus];
    g.font = '13px ui-monospace,monospace';
    g.fillStyle = '#9fe6ff';
    g.fillText(face + '   ' + note + '   (click anywhere to go back)', 24, 28);
    g.fillStyle = mono ? '#9fffb0' : '#ffd166';
    g.fillText(mono ? 'fixed advance - safe everywhere, cards included'
                    : 'proportional - titles and prose only, not card titles', 24, 48);
    const rows = [['WAVE 12', u * C._WAVEF], ['GAME OVER', u * 2.2],
                  ['THREAT LEVEL 47', u * C._KILLF], ['RAINBOW READY', u * C._KILLF],
                  ['CLICK/SPACE & HOLD', u * C._KILLF * C._HINTF],
                  ['RAINBOW COOLDOWN', u * 0.9], ['Pick a Power Up', u * 0.9],
                  ['One Long Night', u * 1.8]];
    let y = 80;
    for (const [s, px] of rows) {
      y += px * 1.25;
      if (y > H - 12) break;
      g.font = (px | 0) + 'px ' + face;
      g.fillStyle = px > u * 1.5 ? '#ffd60a' : '#fff';
      g.fillText(s, 24, y);
    }
    return;
  }

  const cols = W > 900 ? 2 : 1;
  const rows = Math.ceil(FACES.length / cols);
  const cw = W / cols, rh = (H - 14) / rows;
  FACES.forEach(([face, mono, note], i) => {
    const cx = 20 + (i % cols) * cw, cy = 20 + ((i / cols) | 0) * rh;
    g.font = '11px ui-monospace,monospace';
    g.fillStyle = i === 0 ? '#ff8a8a' : mono ? '#9fffb0' : '#ffd166';
    const cost = face.length - BASE;
    g.fillText(face + '   ' + (cost > 0 ? '+' + cost : cost) + ' chars   ' +
      (mono ? 'FIXED' : 'proportional') + '   ' + note, cx, cy);
    // the face, drawn in itself, at the size the HUD really uses
    g.font = (u * 1.15 | 0) + 'px ' + face;
    g.fillStyle = '#fff';
    g.fillText('WAVE 12  RAINBOW READY', cx, cy + rh * 0.46);
    g.font = (u * 1.7 | 0) + 'px ' + face;
    g.fillStyle = '#ffd60a';
    g.fillText('One Long Night', cx, cy + rh * 0.82);
    g.strokeStyle = '#ffffff12';
    g.beginPath();
    g.moveTo(cx - 8, cy + rh - 12);
    g.lineTo(cx + cw - 28, cy + rh - 12);
    g.stroke();
  });
  g.font = '12px ui-monospace,monospace';
  g.fillStyle = '#59618a';
  g.fillText('click a face to see it big  ·  resize the window, every size is a fraction of it',
    20, H - 4);
};

cv.addEventListener('click', (e) => {
  if (focus >= 0) { focus = -1; draw(); return; }
  const W = innerWidth, H = innerHeight;
  const cols = W > 900 ? 2 : 1;
  const rows = Math.ceil(FACES.length / cols);
  const col = Math.min(cols - 1, (e.clientX / (W / cols)) | 0);
  const row = Math.min(rows - 1, ((e.clientY - 6) / ((H - 14) / rows)) | 0);
  const i = row * cols + col;
  if (i >= 0 && i < FACES.length) { focus = i; draw(); }
});
addEventListener('resize', draw);
draw();
</script>
</body>
</html>
