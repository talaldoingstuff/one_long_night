<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ghost editor</title>
<style>
  html,body{margin:0;height:100%;background:#05060e;overflow:hidden;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#c8cee6}
  canvas{display:block;position:fixed;inset:0}
  #panel{position:fixed;top:0;left:0;bottom:0;width:330px;background:#0c0e18f2;border-right:1px solid #232a44;
         overflow-y:auto;padding:10px 12px 40px;box-shadow:8px 0 24px #0008;transition:transform .18s}
  #panel.hid{transform:translateX(-318px)}
  #grip{position:fixed;top:0;left:330px;width:12px;height:100%;cursor:col-resize;background:#161c30;
        border-left:1px solid #232a44;transition:left .18s;display:flex;align-items:center;justify-content:center;color:#6b7599}
  #grip.hid{left:12px}
  h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7f89b0;margin:16px 0 6px;
     border-bottom:1px solid #232a44;padding-bottom:4px}
  h2:first-child{margin-top:0}
  .row{display:grid;grid-template-columns:74px 1fr 54px;gap:6px;align-items:center;margin:2px 0}
  .row label{color:#8b93b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row input[type=range]{width:100%;accent-color:#ff3b6b}
  .row .v{text-align:right;color:#e8ecf8;font-variant-numeric:tabular-nums}
  .btns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
  button{background:#1a2138;border:1px solid #2e3860;color:#c8cee6;
         padding:5px 9px;border-radius:4px;cursor:pointer;font:inherit}
  button:hover{background:#232c4a}
  button.on{background:#ff3b6b;border-color:#ff3b6b;color:#12060c}
  textarea{width:100%;height:170px;background:#070912;color:#9fb0d8;border:1px solid #232a44;
           border-radius:4px;font:11px/1.45 ui-monospace,monospace;padding:6px;resize:vertical}
  #hint{position:fixed;left:356px;bottom:10px;color:#59618a}
  #chk{margin:0 0 8px;padding:6px 8px;border-radius:4px;background:#101528;border:1px solid #232a44;line-height:1.7}
  #chk b{font-weight:400;color:#8b93b8;display:inline-block;width:118px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="grip">›</div>
<div id="panel"></div>
<div id="hint">drag to look · it fires on its own · hold to bind · the preview is the game itself</div>

<script type="module">
// Drives the GAME, not a copy of it: main.js takes over #c and runs its own loop,
// and this mutates the same C and TYPES it reads every frame.
const M = await import('/src/main.js');
const { C } = M;

const NAMES = ['Drifter', 'Darter', 'Hulk', 'Splitter', 'Warden'];
const HP = 0, SPEED = 1, DMG = 2, COST = 3, WAVE = 4, RAD = 5, WOB = 6, FREQ = 7, WISP = 8,
      COL = 9, EYE = 10, HORN = 11, MOUTH = 12, TILT = 13, MBOW = 14, MH = 15, MY = 16;

const $ = (id) => document.getElementById(id);
const panel = $('panel');
const ORIG = JSON.parse(JSON.stringify(C.TYPES));

let type = 0;         // which ghost is on the field
let dist = 7;         // how far it stands, when pinned
let pinned = true;    // pinned still, or walking at you
let alive = true;     // put a new one out when the last dies

const ctl = [];
const h2 = (t) => { const e = document.createElement('h2'); e.textContent = t; panel.append(e); };
const slider = (label, get, set, lo, hi, step, fmt) => {
  const row = document.createElement('div');
  row.className = 'row';
  const l = document.createElement('label'); l.textContent = label;
  const i = document.createElement('input');
  i.type = 'range'; i.min = lo; i.max = hi; i.step = step;
  const v = document.createElement('span'); v.className = 'v';
  const sync = () => { i.value = get(); v.textContent = fmt ? fmt(get()) : (+get()).toFixed(3); };
  i.oninput = () => { set(+i.value); sync(); dump(); };
  row.append(l, i, v);
  panel.append(row);
  sync(); ctl.push(sync);
};
const btnRow = () => { const d = document.createElement('div'); d.className = 'btns'; panel.append(d); return d; };
const btn = (label, onclick, host) => {
  const b = document.createElement('button');
  b.textContent = label; b.onclick = () => onclick(b);
  (host || panel).append(b);
  return b;
};
const T = () => C.TYPES[type];

// --- the field ---------------------------------------------------------------
// One ghost, of the type you are looking at. The wave machinery is switched off
// rather than fought with: a budget that never empties means the wave never turns
// over, so the card screen never takes the view away while you are tuning.
const quiet = () => {
  C.BUD0 = 1e6; C.BUDR = 1; C.SPAWN = 1e6;
  M.restart(); M.look(0, 0); M.place([]);
};
const put = () => {
  const t = T();
  M.place([[0, C.GY, dist, t[HP], t[HP], 0, 1.7, type, 0]]);
};
quiet(); put();

// Kept alive and, if pinned, kept where you put it. Writing straight into the
// live array rather than re-placing keeps its hp and its hit flash - re-placing
// every frame would make a ghost that can never be seen taking damage.
setInterval(() => {
  // A pinned ghost can still reach you if you unpin it and look away. Start over
  // rather than leaving the results screen up over the thing being tuned.
  if (M.dbg().over) { quiet(); put(); return; }
  const gs = M.dbg().ghosts;
  const mine = gs.find((o) => o[7] === type);
  if (!mine) { if (alive) { M.place([]); put(); } return; }
  if (gs.length > 1) M.place([mine]);
  if (pinned) { mine[0] = 0; mine[2] = dist; }
  const t = T();
  $('chk').innerHTML =
    '<b>hp</b>' + mine[3].toFixed(1) + ' of ' + t[HP] + '<br>' +
    '<b>range</b>' + Math.hypot(mine[0], mine[2]).toFixed(2) + 'm<br>' +
    '<b>walk-in</b>' + ((C.ARENA - C.GCONTACT) / t[SPEED]).toFixed(1) + 's from the ring<br>' +
    '<b>shots to kill</b>' + Math.ceil(t[HP] / M.anim().dmg);
}, 1000 / 30);

// --- the panel ----------------------------------------------------------------
const chk = document.createElement('div');
chk.id = 'chk';
panel.append(chk);

h2('which ghost');
const tabs = btnRow();
const tabBtns = NAMES.map((n, k) => btn(n, () => {
  type = k;
  M.place([]); put();
  tabBtns.forEach((b, j) => b.classList.toggle('on', j === k));
  ctl.forEach((s) => s());
  dump();
}, tabs));
tabBtns[0].classList.add('on');

const acts = btnRow();
btn('respawn', () => { M.place([]); put(); }, acts);
btn('pinned', (b) => { pinned = !pinned; b.classList.toggle('on', pinned); }, acts).classList.add('on');
btn('auto respawn', (b) => { alive = !alive; b.classList.toggle('on', alive); }, acts).classList.add('on');
btn('reset type', () => {
  C.TYPES[type] = JSON.parse(JSON.stringify(ORIG[type]));
  M.place([]); put(); ctl.forEach((s) => s()); dump();
}, acts);

h2('where it stands');
slider('range', () => dist, (v) => { dist = v; }, 1.5, 16, 0.5, (v) => (+v).toFixed(1) + 'm');

h2('this ghost');
slider('radius', () => T()[RAD], (v) => (T()[RAD] = v), 0.15, 1.6, 0.01, (v) => (+v).toFixed(2) + 'm');
slider('wisps', () => T()[WISP], (v) => (T()[WISP] = v | 0), 3, 12, 1, (v) => (v | 0) + ' teeth');
slider('wobble', () => T()[WOB], (v) => (T()[WOB] = v), 0, 0.3, 0.005);
slider('wobble rate', () => T()[FREQ], (v) => (T()[FREQ] = v | 0), 1, 9, 1, (v) => (v | 0) + '');
slider('eyes', () => T()[EYE], (v) => (T()[EYE] = v | 0), 0, 1, 1,
       (v) => ((v | 0) ? 'scared' : 'round'));
slider('eye height', () => C.EYEH, (v) => (C.EYEH = v), 0.6, 3, 0.05,
       (v) => (+v).toFixed(2) + 'x wide');
slider('eye top', () => C.EYEY, (v) => (C.EYEY = v), -0.1, 0.9, 0.01,
       (v) => (+v).toFixed(2) + ' of radius up');
slider('top edge', () => C.EYEBOW, (v) => (C.EYEBOW = v), 0, 2, 0.05,
       (v) => (+v < 1 ? 'rounded' : +v > 1 ? 'curved in' : 'flat'));
slider('horn', () => T()[HORN], (v) => (T()[HORN] = v), 0, 1.4, 0.05,
       (v) => (+v ? (+v).toFixed(2) + ' of half width' : 'none'));
slider('mouth', () => T()[MOUTH], (v) => (T()[MOUTH] = v), 0, 0.6, 0.01,
       (v) => (+v ? (+v).toFixed(2) + ' of radius' : 'none'));
slider('mouth tall', () => T()[MH], (v) => (T()[MH] = v), -3, 3, 0.05,
       (v) => (+v < 0 ? 'flipped ' : '') + Math.abs(+v).toFixed(2) + 'x wide');
slider('mouth drop', () => T()[MY], (v) => (T()[MY] = v), -0.2, 0.9, 0.01,
       (v) => (+v).toFixed(2) + ' of radius');
slider('eye tilt', () => T()[TILT], (v) => (T()[TILT] = v), -1, 1, 0.05,
       (v) => (+v > 0 ? 'angry ' : +v < 0 ? 'sad ' : 'level ') + (+v).toFixed(2));
slider('mouth curve', () => T()[MBOW], (v) => (T()[MBOW] = v), 0, 2, 0.05,
       (v) => (+v < 1 ? 'rounded' : +v > 1 ? 'curved down' : 'flat'));
slider('red', () => T()[COL][0], (v) => (T()[COL][0] = v | 0), 0, 255, 1, (v) => (v | 0) + '');
slider('green', () => T()[COL][1], (v) => (T()[COL][1] = v | 0), 0, 255, 1, (v) => (v | 0) + '');
slider('blue', () => T()[COL][2], (v) => (T()[COL][2] = v | 0), 0, 255, 1, (v) => (v | 0) + '');

h2('this ghost, to fight');
slider('hp', () => T()[HP], (v) => (T()[HP] = v | 0), 1, 40, 1, (v) => (v | 0) + '');
slider('speed', () => T()[SPEED], (v) => (T()[SPEED] = v), 0.2, 3.5, 0.05, (v) => (+v).toFixed(2) + 'x');
slider('damage', () => T()[DMG], (v) => (T()[DMG] = v | 0), 1, 5, 1, (v) => (v | 0) + '');
slider('cost', () => T()[COST], (v) => (T()[COST] = v | 0), 1, 12, 1, (v) => (v | 0) + '');
slider('unlocks', () => T()[WAVE], (v) => (T()[WAVE] = v | 0), 1, 40, 1, (v) => 'wave ' + (v | 0));

h2('every ghost');
slider('half width', () => C.GW, (v) => (C.GW = v), 0.5, 1.2, 0.01);
slider('dome', () => C.GDOME, (v) => (C.GDOME = v | 0), 4, 30, 1, (v) => (v | 0) + ' segments');
slider('notch depth', () => C.SPIKE, (v) => (C.SPIKE = v), 0.05, 0.6, 0.01);
slider('bob', () => C.GBOB, (v) => (C.GBOB = v), 0, 0.4, 0.01, (v) => (+v).toFixed(2) + 'm');
slider('bob rate', () => C.GBOBR, (v) => (C.GBOBR = v), 0.2, 5, 0.1);
slider('float height', () => C.GY, (v) => (C.GY = v), -0.6, 0.8, 0.01, (v) => (+v).toFixed(2) + 'm');
slider('faintest', () => C.GFADE, (v) => (C.GFADE = v), 0.05, 1, 0.01);
slider('hit flash', () => C.GFLASH, (v) => (C.GFLASH = v), 0.02, 0.5, 0.01, (v) => (+v).toFixed(2) + 's');
slider('target line', () => C.TGTW, (v) => (C.TGTW = v), 1, 12, 0.5, (v) => (+v).toFixed(1) + 'px');
slider('bound line', () => C.BINDW, (v) => (C.BINDW = v), 1, 12, 0.5, (v) => (+v).toFixed(1) + 'px');

h2('paste back into C');
const out = document.createElement('textarea');
panel.append(out);
btn('copy', () => navigator.clipboard.writeText(out.value));

const f = (v) => (+v).toFixed(2).replace(/\.?0+$/, '') || '0';
function dump() {
  out.value =
    '  TYPES: [\n' +
    C.TYPES.map((t, k) =>
      '    [' + [t[HP], t[SPEED].toFixed(2), t[DMG], t[COST], t[WAVE],
                 t[RAD].toFixed(2), f(t[WOB]), t[FREQ], t[WISP]].join(', ') +
      ', [' + t[COL].join(', ') + '], ' + t[EYE] + ', ' + f(t[HORN]) +
      ', ' + f(t[MOUTH]) + ', ' + f(t[TILT]) + ', ' + f(t[MBOW]) +
      ', ' + f(t[MH]) + ', ' + f(t[MY]) + '],' +
      '  // ' + NAMES[k]).join('\n') +
    '\n  ],\n' +
    '  EYEY: ' + f(C.EYEY) + ',  EYEH: ' + f(C.EYEH) + ',  EYEBOW: ' + f(C.EYEBOW) + ',\n' +
    '  GW: ' + f(C.GW) + ',  GDOME: ' + C.GDOME + ',  SPIKE: ' + f(C.SPIKE) + ',\n' +
    '  GBOB: ' + f(C.GBOB) + ',  GBOBR: ' + f(C.GBOBR) + ',  GY: ' + f(C.GY) + ',\n' +
    '  GFADE: ' + f(C.GFADE) + ',  GFLASH: ' + f(C.GFLASH) + ',\n' +
    '  TGTW: ' + f(C.TGTW) + ',  BINDW: ' + f(C.BINDW) + ',';
}
dump();

$('grip').onclick = () => {
  panel.classList.toggle('hid');
  $('grip').classList.toggle('hid');
  $('grip').textContent = panel.classList.contains('hid') ? '›' : '‹';
};
</script>
</body>
</html>
