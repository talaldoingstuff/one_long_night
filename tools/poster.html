<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>poster</title>
<style>
  html,body{margin:0;height:100%;background:#05060e;overflow:hidden;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#c8cee6}
  canvas{display:block;position:fixed;inset:0}
  #panel{position:fixed;top:0;left:0;bottom:0;width:330px;background:#0c0e18f2;border-right:1px solid #232a44;
         overflow-y:auto;padding:10px 12px 40px;box-shadow:8px 0 24px #0008;transition:transform .18s;z-index:3}
  #panel.hid{transform:translateX(-330px)}
  /* A 12px unlabelled strip was collapsible and nobody could tell. This one is a
     real button, wide enough to hit and captioned with what it does. */
  #grip{position:fixed;top:0;left:330px;width:26px;height:100%;cursor:pointer;background:#161c30;
        border-left:1px solid #232a44;transition:left .18s;display:flex;align-items:center;
        justify-content:center;color:#8b93b8;z-index:4;user-select:none}
  #grip:hover{background:#1f2740;color:#ffd23f}
  #grip span{writing-mode:vertical-rl;letter-spacing:.22em;text-transform:uppercase;font-size:10px}
  #grip.hid{left:0}
  h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7f89b0;margin:16px 0 6px;
     border-bottom:1px solid #232a44;padding-bottom:4px}
  h2:first-child{margin-top:0}
  .row{display:grid;grid-template-columns:56px 1fr 52px;gap:6px;align-items:center;margin:2px 0}
  .row label{color:#8b93b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row input[type=range]{width:100%;accent-color:#ffd23f}
  .row .v{text-align:right;color:#e8ecf8;font-variant-numeric:tabular-nums}
  .btns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
  button{background:#1a2138;border:1px solid #2e3860;color:#c8cee6;
         padding:5px 9px;border-radius:4px;cursor:pointer;font:inherit}
  button:hover{background:#232c4a}
  button.on{background:#ffd23f;border-color:#ffd23f;color:#181203}
  textarea{width:100%;height:150px;background:#070912;color:#9fb0d8;border:1px solid #232a44;
           border-radius:4px;font:11px/1.45 ui-monospace,monospace;padding:6px;resize:vertical}
  .slot{border:1px solid #232a44;border-radius:4px;padding:6px 8px;margin:6px 0;background:#0a0d1a}
  .slot.sel{border-color:#ffd23f}
  .slot .hd{display:flex;gap:6px;align-items:center;margin-bottom:4px}
  .slot .hd b{font-weight:400;flex:1;cursor:pointer}
  .swatch{width:10px;height:10px;border-radius:2px;display:inline-block}
  #hint{position:fixed;left:356px;bottom:10px;color:#59618a;z-index:3}
  #note{margin:0 0 8px;padding:6px 8px;border-radius:4px;background:#101528;border:1px solid #232a44;color:#8b93b8}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="grip"><span></span></div>
<div id="panel"></div>
<div id="hint">everything is set from the sliders · tab steps through the ghosts · H hides the panel</div>

<script type="module">
// Drives the GAME, not a copy of it. main.js takes over #c and runs its own loop
// drawing the title screen; this paints the cast on top of that same canvas every
// frame, through main.js's OWN drawGhost and puppet. Nothing here re-draws a path
// the game knows how to draw, so a poster cannot show art the game does not have.
const M = await import('/src/main.js');
const { C } = M;
const cv = document.getElementById('c');
const g = cv.getContext('2d');

const NAMES = ['Drifter', 'Darter', 'Hulk', 'Splitter', 'Warden'];
const $ = (id) => document.getElementById(id);
const panel = $('panel');

// One press to get past the lore, which holds until it is dismissed and would
// otherwise BE the background. Sent before the input is sealed off below, because
// after that the game cannot be reached by a pointer at all. Guarded because
// tests/edcheck.mjs loads this page in a stub that has no PointerEvent.
try { dispatchEvent(new PointerEvent('pointerdown', { clientX: 10, clientY: 10 })); } catch (e) {}

// The game listens on WINDOW, so every click in this tool would also reach it -
// dragging a ghost would walk the title screen into a run. These stop the event at
// the canvas and at the panel, which is after the panel's own controls have had it
// and before it can bubble up to the game. Nothing here needs the game to see a
// pointer: the composition is the tool's, and the frame under it is fixed.
const seal = (el) => ['pointerdown', 'pointermove', 'pointerup', 'pointercancel', 'keydown', 'keyup']
  .forEach((t) => el.addEventListener(t, (e) => e.stopPropagation()));
seal(panel);
seal($('grip'));

// Every word the title screen draws - the title itself, the prompt under it and
// the version - comes off the card. The picture is the art, and a posted card gets
// its wordmark set properly in whatever it is laid out in rather than borrowing the
// game's own heading at whatever size the window happened to be.
//
// Dropped by NAME at the context. Blunt, but honest: it takes nothing away from
// the game, and if a string is ever reworded the line simply comes back and is
// visible in the picture. Zeroing their alpha through C would have been subtler and
// would have failed silently.
const CHROME = ['ONE LONG NIGHT', 'CLICK ANYWHERE TO START', 'CLICK ANYWHERE TO SKIP',
                'CLICK ANYWHERE TO PLAY', 'HOW TO PLAY', 'PERSONAL BEST'];
const realText = g.fillText.bind(g);
let chrome = 0;
g.fillText = (s, x, y) => {
  if (!chrome && (CHROME.includes(s) || s === C._VER)) return;
  realText(s, x, y);
};

// x and y are FRACTIONS of the frame, so a composition survives the window being
// resized and means the same thing at export size as it did while it was made.
const DEF = () => ([
  { on: 1, k: 0, x: 0.13, y: 0.70, s: 0.80, r: 0 },
  { on: 1, k: 1, x: 0.29, y: 0.66, s: 0.72, r: 0 },
  { on: 1, k: 2, x: 0.45, y: 0.72, s: 0.86, r: 0 },
  { on: 1, k: 3, x: 0.61, y: 0.66, s: 0.72, r: 0 },
  { on: 1, k: 4, x: 0.77, y: 0.70, s: 0.80, r: 0 },
]);
const GDEF = () => ({ on: 1, x: 0.5, y: 0.5, s: 1, r: 0 });

let gh = DEF(), gun = GDEF(), sel = 0, guides = 1, aspect = 0;
const ASPECT = [['free', 0], ['16:9', 16 / 9], ['1.91:1', 1.91], ['1:1', 1], ['4:5', 0.8]];

// The distance a slot's ghost stands at. Scale is a multiplier ON this, so slot
// scale 1 is the same size for every type and the type's own radius still shows -
// a Hulk is meant to be bigger than a Darter and picking them apart by hand would
// have thrown that away.
const DIST = 6;

const store = () => { try { localStorage.setItem('poster', JSON.stringify({ gh, gun })); } catch (e) {} };
try {
  const p = JSON.parse(localStorage.getItem('poster'));
  if (p && p.gh) { gh = p.gh; gun = p.gun || GDEF(); }
} catch (e) {}

// --- the panel ---------------------------------------------------------------
const row = (lab, min, max, step, get, set) => {
  const d = document.createElement('div');
  d.className = 'row';
  d.innerHTML = '<label>' + lab + '</label><input type=range><span class=v></span>';
  const [r, v] = [d.querySelector('input'), d.querySelector('.v')];
  Object.assign(r, { min, max, step });
  const show = () => { r.value = get(); v.textContent = (+get()).toFixed(step < 0.01 ? 3 : 2); };
  r.oninput = () => { set(+r.value); show(); dump(); store(); };
  show();
  d.show = show;
  return d;
};

const slots = [];
// Which slot is outlined, WITHOUT rebuilding anything. Selecting used to call
// build(), and build() replaces the panel's whole contents - so a mousedown on a
// slider destroyed that slider before it could be dragged, and destroyed a button
// between its own mousedown and mouseup so the click never landed. Nothing in the
// panel worked except the sliders in the gun section, which sits outside a slot.
const markSel = () => slots.forEach((b, i) => b.classList.toggle('sel', i === sel));

const build = () => {
  panel.innerHTML = '';
  // This holds ELEMENTS and build() throws every element away, so without the
  // reset it grows by a whole panel on every rebuild.
  slots.length = 0;
  const h = (t) => { const e = document.createElement('h2'); e.textContent = t; panel.append(e); };
  const fb = document.createElement('div');
  fb.className = 'btns';
  const fold = document.createElement('button');
  fold.id = 'fold';
  fold.textContent = 'hide panel';
  fold.onclick = () => collapse();
  fb.append(fold);
  panel.append(fb);
  const note = document.createElement('div');
  note.id = 'note';
  note.textContent = 'The background is the game drawing its own title screen. ' +
    'Everything below is painted over it with the game’s own ghost and viewmodel ' +
    'code, and positioned from these sliders alone.';
  panel.append(note);

  h('the hand and the gun');
  const gb = document.createElement('div');
  gb.className = 'btns';
  const gt = document.createElement('button');
  gt.textContent = 'shown';
  gt.className = gun.on ? 'on' : '';
  gt.onclick = () => { gun.on = !gun.on; gt.className = gun.on ? 'on' : ''; store(); };
  gb.append(gt);
  panel.append(gb);
  for (const [lab, key, mn, mx, st] of [['x', 'x', -0.5, 1.5, 0.001], ['y', 'y', -0.5, 1.5, 0.001],
                                        ['scale', 's', 0.1, 4, 0.01], ['turn', 'r', -3.15, 3.15, 0.01]]) {
    panel.append(row(lab, mn, mx, st, () => gun[key], (v) => (gun[key] = v)));
  }

  h('the five ghosts');
  gh.forEach((s, i) => {
    const box = document.createElement('div');
    box.className = 'slot' + (i === sel ? ' sel' : '');
    // A control inside the slot gets to keep its own event: a click on the type or
    // on/off button, and every drag of a slider, starts with a mousedown in here.
    box.onmousedown = (e) => {
      if (e.target.closest('input,button')) return;
      sel = i;
      markSel();
    };
    slots.push(box);
    const hd = document.createElement('div');
    hd.className = 'hd';
    hd.innerHTML = '<span class=swatch style="background:rgb(' + C._TYPES[s.k][9] + ')"></span>' +
                   '<b>' + NAMES[s.k] + '</b>';
    const on = document.createElement('button');
    on.textContent = s.on ? 'on' : 'off';
    on.className = s.on ? 'on' : '';
    on.onclick = (e) => { e.stopPropagation(); s.on = !s.on; build(); store(); };
    const nx = document.createElement('button');
    nx.textContent = 'type';
    nx.onclick = (e) => { e.stopPropagation(); s.k = (s.k + 1) % 5; build(); store(); };
    hd.append(nx, on);
    box.append(hd);
    for (const [lab, key, mn, mx, st] of [['x', 'x', -0.2, 1.2, 0.001], ['y', 'y', -0.2, 1.2, 0.001],
                                          ['scale', 's', 0.1, 4, 0.01], ['turn', 'r', -3.15, 3.15, 0.01]]) {
      box.append(row(lab, mn, mx, st, () => s[key], (v) => (s[key] = v)));
    }
    panel.append(box);
  });

  h('the frame');
  const ab = document.createElement('div');
  ab.className = 'btns';
  ASPECT.forEach(([lab], i) => {
    const b = document.createElement('button');
    b.textContent = lab;
    b.className = i === aspect ? 'on' : '';
    b.onclick = () => { aspect = i; build(); };
    ab.append(b);
  });
  panel.append(ab);
  const gb2 = document.createElement('div');
  gb2.className = 'btns';
  const gg = document.createElement('button');
  gg.textContent = 'guides';
  gg.className = guides ? 'on' : '';
  gg.onclick = () => { guides = !guides; gg.className = guides ? 'on' : ''; };
  const ch = document.createElement('button');
  ch.textContent = 'game text';
  ch.className = chrome ? 'on' : '';
  ch.onclick = () => { chrome = !chrome; ch.className = chrome ? 'on' : ''; };
  const ex = document.createElement('button');
  ex.textContent = 'save png';
  ex.onclick = save;
  const rs = document.createElement('button');
  rs.textContent = 'reset';
  rs.onclick = () => { gh = DEF(); gun = GDEF(); build(); store(); };
  gb2.append(gg, ch, ex, rs);
  panel.append(gb2);

  h('the numbers');
  const ta = document.createElement('textarea');
  ta.readOnly = true;
  ta.id = 'out';
  panel.append(ta);
  dump();
};

const dump = () => {
  const t = $('out');
  if (!t) return;
  const f = (n) => (+n).toFixed(3);
  t.value = 'gun  x ' + f(gun.x) + '  y ' + f(gun.y) + '  scale ' + f(gun.s) + '  turn ' + f(gun.r) +
    (gun.on ? '' : '   (hidden)') + '\n' +
    gh.map((s, i) => (i + 1) + ' ' + NAMES[s.k].padEnd(9) + ' x ' + f(s.x) + '  y ' + f(s.y) +
      '  scale ' + f(s.s) + '  turn ' + f(s.r) + (s.on ? '' : '   (hidden)')).join('\n') +
    '\n\nx and y are fractions of the frame, so they hold at any size.';
};

// --- the export frame ---------------------------------------------------------
// The window is whatever shape it is; a social card is not. This is the largest
// rectangle of the chosen ratio that fits, centred - what the guides draw and what
// save() crops to, so the picture that comes out is the picture that was composed.
// The panel is a DOM overlay sitting on the left of the canvas, so anything
// composed under it is invisible while it is being composed - the leftmost ghost
// started there and could be neither seen nor picked up. The card is laid out in
// what is actually VISIBLE, and folding the panel gives that width back.
//
// Nothing moves when it folds: x and y are fractions of the frame, so the picture
// is the same picture in a wider rectangle. That is what they are fractions for.
const stage = () => {
  const dpr = cv.width / cv.clientWidth || 1;
  const left = hid ? 0 : (panel.getBoundingClientRect().right + 26) * dpr;
  return [left, 0, cv.width - left, cv.height];
};

const frame = () => {
  const [sx, sy, sw, sh] = stage();
  const a = ASPECT[aspect][1];
  if (!a) return [sx, sy, sw, sh];
  let w = sw, h = w / a;
  if (h > sh) { h = sh; w = h * a; }
  return [sx + (sw - w) / 2, sy + (sh - h) / 2, w, h];
};

// --- painting -----------------------------------------------------------------
// Runs AFTER the game's own frame. Both callbacks re-register during the frame
// they run in, so the order they were first registered in is the order they keep -
// and this one was registered second, which is what puts it on top.
const paint = () => {
  const [fx, fy, fw, fh] = frame();
  const at = (o, fn) => {
    g.save();
    g.translate(fx + o.x * fw, fy + o.y * fh);
    // Scale off the FRAME rather than the window, so a composition that fits at
    // one size fits at every size.
    const k = o.s * fh / cv.height;
    g.scale(k, k);
    g.rotate(o.r);
    g.translate(-cv.width / 2, -cv.height / 2);
    fn();
    g.restore();
  };

  // The gun first, then the ghosts over it: they are meant to be in front of it.
  if (gun.on) at(gun, M.drawPuppet);
  for (const s of gh)
    if (s.on)
      at(s, () => M.paintGhost([0, C._GY, DIST, 1, 1, 0, s.k * 2.3, s.k, 0]));

  if (guides) {
    g.save();
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalAlpha = 1;
    if (ASPECT[aspect][1]) {
      // Everything outside the card, dimmed rather than hidden, so what is being
      // cut off is still visible while it is being composed.
      const [sx, , sw] = stage();
      g.fillStyle = '#05060ecc';
      g.fillRect(sx, 0, sw, fy);
      g.fillRect(sx, fy + fh, sw, cv.height - fy - fh);
      g.fillRect(sx, fy, fx - sx, fh);
      g.fillRect(fx + fw, fy, sx + sw - fx - fw, fh);
    }
    g.strokeStyle = '#ffd23f66';
    g.lineWidth = 1;
    g.strokeRect(fx + 0.5, fy + 0.5, fw - 1, fh - 1);
    g.strokeStyle = '#ffd23f22';
    for (let i = 1; i < 3; i++) {
      g.beginPath();
      g.moveTo(fx + fw * i / 3, fy); g.lineTo(fx + fw * i / 3, fy + fh);
      g.moveTo(fx, fy + fh * i / 3); g.lineTo(fx + fw, fy + fh * i / 3);
      g.stroke();
    }
    g.restore();
  }
  requestAnimationFrame(paint);
};

// --- the picture takes no input -------------------------------------------------
// Everything is set from the sliders. The canvas is still sealed, because the game
// underneath it listens on WINDOW and a stray click would otherwise walk the title
// screen into a run - but nothing here reads a pointer.
seal(cv);

// --- saving --------------------------------------------------------------------
// Draws one clean frame with the guides off and crops to the card, so what is
// saved is the picture and not the tool.
const save = () => {
  const was = guides;
  guides = 0;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const [fx, fy, fw, fh] = frame();
    const o = document.createElement('canvas');
    o.width = Math.round(fw); o.height = Math.round(fh);
    o.getContext('2d').drawImage(cv, fx, fy, fw, fh, 0, 0, o.width, o.height);
    const a = document.createElement('a');
    a.download = 'one-long-night-' + ASPECT[aspect][0].replace(':', 'x') + '.png';
    a.href = o.toDataURL();
    a.click();
    guides = was;
  }));
};

// --- collapsing the panel -------------------------------------------------------
// One function, so the button, the grip and the H key cannot disagree about what
// state the panel is in - which is what a toggle written three times always ends up
// doing. The caption says what a click will DO, not what is currently true.
const grip = $('grip');
let hid = 0;
const collapse = (v) => {
  hid = v === undefined ? !hid : v;
  panel.classList.toggle('hid', !!hid);
  grip.classList.toggle('hid', !!hid);
  grip.querySelector('span').textContent = hid ? '›  show the panel' : '‹  hide the panel';
  const b = $('fold');
  if (b) b.textContent = hid ? 'show panel' : 'hide panel';
};
grip.onclick = () => collapse();

addEventListener('keydown', (e) => {
  if (e.key === 'h' || e.key === 'H') collapse();
  if (e.key === 'Tab') { e.preventDefault(); sel = (sel + 1) % gh.length; markSel(); }
  if (e.key === 's' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); save(); }
});

M.setScr(0);
build();
collapse(0);
requestAnimationFrame(paint);
</script>
</body>
</html>
